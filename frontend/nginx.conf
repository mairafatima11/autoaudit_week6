server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend container (Docker Compose service name
    # "api"). Same-origin from the browser's point of view, so no CORS
    # configuration is needed in this deployment path.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback — client-side routing (React Router) owns everything else.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
